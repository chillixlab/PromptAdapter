[project]
name = "promptadapter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.1.9",
    "litellm>=1.81.9",
    "pandas>=3.0.0",
    "pydantic-settings>=2.12.0",
    "ragas>=0.4.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear: 潜在的なバグを検出
    "I",   # isort: import順の整形チェック
    "SIM", # flake8-simplify: 冗長な書き方の簡略化
    "UP",  # pyupgrade: 新しいPython構文への改善提案
]
